# Vérifie Somnia (tests, syntaxe) puis publie la démo statique sur GitHub Pages
# et le paquet ZIP pour Hostinger. Sur GitHub Pages, PHP n'existe pas : l'app
# fonctionne entièrement, sauf les notifications de secours (réservées à Hostinger).
name: Somnia

on:
  push:
    branches: [main, claude/iphone-sleep-tracker-app-twjbdm]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier PHP
        run: php -v && php -m | grep -E "openssl|curl"
      - name: Vérifications (syntaxe, service worker)
        run: node scripts/check.mjs
      - name: Tests (calculs, données, alarmes, service push PHP)
        run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le site
        run: |
          node scripts/package.mjs
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js fonts icons design _site/
          mkdir -p _site/docs && cp docs/PRIVACY.md _site/docs/
          cp dist/somnia-hostinger.zip _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
